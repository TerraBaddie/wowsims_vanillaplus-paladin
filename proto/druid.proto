syntax = "proto3";
package proto;

option go_package = "./proto";

import "common.proto";

message DruidTalents {
	// Balance
	int32 starlight_wrath = 1;
	int32 improved_moonfire = 2;
	int32 cycle_of_life = 3;
	int32 omnipresence = 4;
	int32 natural_weapons = 5;
	int32 unity_with_nature = 6;
	int32 mighty_roots = 7;
	bool hurricane = 8;
	int32 starfall = 9;
	int32 improved_faerie_fire = 10;
	int32 vengeance = 11;
	int32 power_of_nature = 12;
	int32 dreamstate = 13;
	bool moonkin_form = 14;
	bool natures_grace = 15;
	int32 moonglow = 16;
	int32 moonfury = 17;
	int32 nature_balancer = 18;
	bool moonkin_aura = 19;

	// Feral Combat
	int32 ferocity = 20;
	int32 feral_aggression = 21;
	int32 thick_hide = 22;
	int32 primal_tenacity = 23;
	int32 brutal_impact = 24;
	int32 sharpened_claws = 25;
	int32 primal_fury = 26;
	int32 feline_swiftness = 27;
	bool feral_charge = 28;
	int32 blood_frenzy = 29;
	bool leap = 30;
	int32 feral_instinct = 31;
	int32 stalking = 32;
	int32 heart_of_the_wild = 33;
	int32 savage_fury = 34;
	int32 predatory_strikes = 35;
	bool untamed_heart = 36;
	int32 killer_instincts = 37;
	int32 survival_instincts = 38;
	bool leader_of_the_pack = 39;

	// Restoration
	int32 accuracy = 40;
	int32 natures_focus = 41;
	int32 furor = 42;
	int32 natural_shapeshifter = 43;
	int32 naturalist = 44;
	int32 subtlety = 45;
	int32 improved_enrage = 46;
	bool natures_swiftness = 47;
	bool omen_of_clarity = 48;
	int32 custody_of_the_nature = 49;
	int32 improved_mark_of_the_wild = 50;
	int32 gift_of_nature = 51;
	int32 improved_rejuvenation = 52;
	int32 reflection = 53;
	int32 tranquil_spirit = 54;
	bool swiftmend = 55;
	int32 catharsis = 56;
	int32 animism = 57;
	int32 improved_regrowth = 58;
	bool swiftbloom = 59;
}

message BalanceDruid {
  message Rotation {
	}

  message Options {
    UnitReference innervate_target = 1;
	float okf_uptime = 2;
  }
  Options options = 3;
}

message FeralDruid {
  message Rotation {
		bool maintain_faerie_fire = 1;
		int32 min_combos_for_rip = 2;
		float max_wait_time = 3;
		float preroar_duration = 4;
		bool precast_tigers_fury = 5;
		bool use_shred_trick = 6;
  }
	Rotation rotation = 1;

  message Options {
    UnitReference innervate_target = 1;
    int32 latency_ms = 2;
    bool assume_bleed_active = 4;
  }
  Options options = 3;
}

message FeralTankDruid {
  message Rotation {
		// Minimum rage to queue HS or Cleave.
		int32 maul_rage_threshold = 1;
		bool maintain_demoralizing_roar = 2;
		double lacerate_time = 3;
  }

  message Options {
    UnitReference innervate_target = 1;
		double starting_rage = 2;
  }
  Options options = 3;
}

message RestorationDruid {
  message Rotation {
  }

  message Options {
    UnitReference innervate_target = 1;
  }
  Options options = 3;
}
