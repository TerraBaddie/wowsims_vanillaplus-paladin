syntax = "proto3";
package proto;

option go_package = "./proto";

message HunterTalents {
	// Beast Mastery
	int32 improved_aspect_of_the_monkey = 1;
	int32 improved_aspect_of_the_hawk = 2;
	int32 endurance_training = 3;
	int32 thick_hide = 4;
	int32 improved_mend_pet = 5;
	int32 aspect_mastery = 6;
	int32 improved_revive_pet = 7;
	bool intimidation = 8;
	int32 unleashed_fury = 9;
	int32 bestial_swiftness = 10;
	int32 survival_instincts = 11;
	int32 bestial_discipline = 12;
	int32 ferocity = 13;
	int32 team_play = 14;
	bool bestial_wrath = 15;
	int32 savage_flurry = 16;
	int32 spirit_bond = 17;
	int32 frenzy = 18;
	bool kill_command = 19;
	bool terrifying_roar = 20;

	// Marksmanship
	int32 improved_hunters_mark = 21;
	int32 improved_stings = 22;
	int32 efficiency = 23;
	int32 stalking = 24;
	int32 improved_arcane_shot = 25;
	int32 lethal_shots = 26;
	int32 improved_concussive_shot = 27;
	int32 vantage_point = 28;
	bool aimed_shot = 29;
	int32 mortal_shots = 30;
	bool hawk_eye = 31;
	int32 snapshot = 32;
	int32 weapon_expertise = 33;
	int32 improved_distracting_shot = 34;
	bool deadeye = 35;
	int32 barrage = 36;
	bool scatter_shot = 37;
	int32 reconnaissance = 38;
	int32 ranged_weapon_specialization = 39;
	bool trueshot_aura = 40;

	// Survival
	int32 deflection = 41;
	bool deterrence = 42;
	int32 brutality = 43;
	int32 clever_traps = 44;
	int32 survivalist = 45;
	int32 improved_wing_clip = 46;
	int32 savage_strikes = 47;
	int32 dual_wield_specialization = 48;
	bool melee_specialization = 49;
	int32 two_handed_weapon_specialization = 50;
	int32 killer_instinct = 51;
	int32 trapper = 52;
	int32 improved_tracking = 53;
	int32 thrill_of_the_hunt = 54;
	int32 deep_freeze = 55;
	bool savage_blow = 56;
	bool wyvern_sting = 57;
	int32 find_weakness = 58;
	int32 lightning_reflexes = 59;
	bool whirling_axe = 60;
}

message Hunter {
	message Rotation {
		enum RotationType {
			UnknownType = 0;
			SingleTarget = 1;
			Aoe = 3;
			Custom = 2;
		}
		RotationType type = 9;

		enum StingType {
			NoSting = 0;
			ScorpidSting = 1;
			SerpentSting = 2;
		}
		StingType sting = 2;
		bool multi_dot_serpent_sting = 3;
	}
	
	message Options {
		enum Ammo {
			AmmoNone = 0;
			// 25
			RazorArrow = 1;
			SolidShot = 2;
			// 40
			JaggedArrow = 3;
			AccurateSlugs = 4;
			// 50
			MithrilGyroShot = 5;
			RockshardPellets = 6;
			// 60
			IceThreadedArrow = 7;
			ThoriumHeadedArrow = 8;
			Doomshot = 9;
			IceThreadedBullet = 10;
			ThoriumShells = 11;
			MiniatureCannonBalls = 12;
		}
		Ammo ammo = 1;

		enum QuiverBonus
		{
			QuiverNone = 0;
			Speed10 = 1;
			Speed11 = 2;
			Speed12 = 3;
			Speed13 = 4;
			Speed14 = 5;
			Speed15 = 6;
		}
		QuiverBonus quiver_bonus = 2;

		enum PetType {
			PetNone = 0;
			Cat = 1;
			WindSerpent = 2;
			Wolf = 3;
			Bat = 4;
			Bear = 5;
			Owl = 6;
			Boar = 7;
			CarrionBird = 8;
			Crab = 9;
			Crocolisk = 10;
			Gorilla = 11;
			Hyena = 12;
			Raptor = 13;
			Scorpid = 14;
			Spider = 15;
			Tallstrider = 16;
			Turtle = 17;
		}

		enum PetAttackSpeed {
			One = 0;
			OneTwo = 1;
			OneThree = 2;
			OneFour = 3;
			OneFive = 4;
			OneSix = 5;
			OneSeven = 6;
			Two = 7;
			TwoFour = 8;
			TwoFive = 9;
		}

		PetType pet_type = 3;
		double pet_uptime = 4;

		double pet_attack_speed_old = 5;

		bool new_raptor_strike = 6;

		PetAttackSpeed pet_attack_speed = 7;
	}
	Options options = 2;
}
