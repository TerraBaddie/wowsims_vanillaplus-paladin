syntax = "proto3";
package proto;

option go_package = "./proto";

import "common.proto";

message PriestTalents {
	// Discipline
	int32 silent_resolve = 1;
	int32 pilgrimage = 2;
	int32 wand_specialization = 3;
	int32 improved_power_word_fortitude = 4;
	int32 concentration = 5;
	int32 improved_inner_fire = 6;
	int32 martyrdom = 7;
	int32 improved_dispel_magic = 8;
	int32 mental_strength = 9;
	bool inner_focus = 10;
	bool focused_casting = 11;
	int32 stratagem = 12;
	int32 mental_agility = 13;
	int32 meditation = 14;
	int32 improved_power_word_shield = 15;
	bool power_word_requital = 16;
	int32 twin_disciplines = 17;
	int32 improved_memory = 18;
	int32 force_of_will = 19;
	bool power_infusion = 20;

	// Holy
	int32 holy_focus = 21;
	int32 improved_renew = 22;
	int32 spell_warding = 23;
	int32 spell_focus = 24;
	int32 lights_grace = 25;
	int32 divine_fury = 26;
	int32 blessed_recovery = 27;
	bool holy_nova = 28;
	int32 holy_specialization = 29;
	int32 improved_healing = 30;
	int32 holy_reach = 31;
	int32 purifying_light = 32;
	int32 searing_light = 33;
	int32 spiritual_guidance = 34;
	int32 improved_prayer_of_healing = 35;
	bool spirit_of_redemption = 36;
	int32 inspiration = 37;
	int32 spiritual_healing = 38;
	int32 faith = 39;
	bool holy_link = 40;

	// Shadow
	int32 shadow_affinity = 41;
	int32 improved_shadow_word_pain = 42;
	int32 blackout = 43;
	int32 spirit_tap = 44;
	int32 improved_mind_blast = 45;
	int32 shadow_focus = 46;
	int32 improved_psychic_scream = 47;
	bool mind_flay = 48;
	int32 improved_mind_flay = 49;
	bool shadow_word_numb = 50;
	int32 improved_shadow_word_silence = 51;
	int32 blur = 52;
	int32 darkness = 53;
	int32 improved_vampiric_embrace = 54;
	bool vampiric_embrace = 55;
	int32 burnt_soul = 56;
	int32 mind_overlord = 57;
	int32 shadow_weaving = 58;
	bool insanity = 59;
	bool shadowform = 60;
}

message ShadowPriest {
	message Rotation {
	}

	message Options {
		enum Armor {
			NoArmor = 0;
			InnerFire = 1;
		}

		bool use_shadowfiend = 1;
		Armor armor = 2;
		bool use_mind_blast = 4;
		UnitReference power_infusion_target = 5;
		double latency = 6 [deprecated = true]; // Latency between actions
	}
	Options options = 3;
}

message HealingPriest {
	message Rotation {
	}

	message Options {
		bool use_inner_fire = 2;
		UnitReference power_infusion_target = 1;
	}
	Options options = 3;
}
